admin:
  username: admin
  password: REPLACE_ME
# Any S3-compatible object storage. Vendor examples:
#   Aliyun OSS:  endpoint: https://s3.oss-cn-hangzhou.aliyuncs.com, region: cn-hangzhou
#   Qcloud COS:  endpoint: https://cos.ap-guangzhou.myqcloud.com,   region: ap-guangzhou
#   AWS S3:      endpoint: https://s3.us-east-1.amazonaws.com,      region: us-east-1
#   MinIO:       endpoint: http://127.0.0.1:9000,                   region: us-east-1, force_path_style: true
s3:
  endpoint: https://s3.oss-cn-hangzhou.aliyuncs.com
  region: cn-hangzhou
  bucket: example-bucket
  access_key_id: REPLACE_ME
  secret_access_key: REPLACE_ME
  # force_path_style: false
upload:
  workspace: upload-workspace
# Required LLM endpoints and vector store; the server refuses to start when
# any of them is missing. Each capability is keyed by provider (unknown keys
# are rejected). chat.openai is used by file analysis on the upload page;
# effort is the model's reasoning effort, headers is an optional map of HTTP
# headers. embeddings.bailian_multimodal_embedding vectorizes the digest
# marks at push time; dimensions is optional. vectors.aliyun_oss_vectors is
# the vector store the digest embeddings are written into; url includes the
# bucket host (<bucket>.<region>.oss-vectors.aliyuncs.com).
llm:
  chat:
    openai:
      url: https://api.example.com/v1/chat/completions
      model: my-model
      effort: medium
      headers:
        Authorization: Bearer REPLACE_ME
  embeddings:
    bailian_multimodal_embedding:
      url: https://api.example.com/v1/embeddings
      model: my-embedding-model
      dimensions: 1024
      headers:
        Authorization: Bearer REPLACE_ME
  vectors:
    aliyun_oss_vectors:
      url: https://example-bucket.cn-hangzhou.oss-vectors.aliyuncs.com
      access_key_id: REPLACE_ME
      access_key_secret: REPLACE_ME
      index: example-index
