<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>filestor — sign in</title>
  {{template "head" .}}
</head>
<body class="flex min-h-screen items-center justify-center">
  <form class="card w-[min(360px,92vw)]" method="post" action="/login">
    <div class="flex flex-col gap-3 p-6">
      <h1 class="flex items-center gap-1.5 text-lg font-semibold"><span class="icon-[lucide--folder-open]"></span> filestor</h1>
      <p class="text-neutral-400">Sign in</p>
      {{if .Error}}<p class="text-red-400">{{.Error}}</p>{{end}}
      <div>
        <label class="mb-1 block text-sm text-neutral-300" for="username"><span class="icon-[lucide--user]"></span> Username</label>
        <input class="input" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div>
        <label class="mb-1 block text-sm text-neutral-300" for="password"><span class="icon-[lucide--lock]"></span> Password</label>
        <input class="input" id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary"><span class="icon-[lucide--log-in]"></span> Sign in</button>
    </div>
  </form>
</body>
</html>
