{{define "head"}}
<link href="{{cssAsset "main"}}" rel="stylesheet">
{{end}}

{{define "nav"}}
<header class="fixed inset-x-0 top-0 z-40 border-b border-neutral-700 bg-neutral-900">
  <div class="flex items-center gap-4 px-4 py-3">
    <a class="flex items-center gap-1.5 text-xl font-semibold text-white" href="/"><span class="icon-[lucide--folder-open]"></span> filestor</a>
    <nav class="me-auto flex gap-1">
      <a class="nav-link{{if eq .Nav "browse"}} active{{end}}" href="/browse"><span class="icon-[lucide--folder]"></span> Browse</a>
      <a class="nav-link{{if eq .Nav "upload"}} active{{end}}" href="/upload"><span class="icon-[lucide--cloud-upload]"></span> Upload</a>
    </nav>
    <form method="post" action="/logout">
      <button type="submit" class="btn btn-sm btn-outline-secondary"><span class="icon-[lucide--log-out]"></span> Sign out</button>
    </form>
  </div>
</header>
{{end}}
